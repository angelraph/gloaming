name: Gloaming Agent loop

# Runs the same "python agent_loop.py --run" cycle that used to run only on a
# local laptop via Windows Task Scheduler. Moved here Sept 12 after confirming
# live that the laptop's Modern Standby power state was stalling runs for
# hours whenever the lid closed, correlating exactly with every gap found in
# the decision log. GitHub Actions runs on GitHub's own servers, independent
# of any local machine being on, closed, asleep, or off - this is the actual
# fix for continuous, unattended operation, not a laptop setting.
#
# The Agent's own is_nyse_closed() check still gates every cycle (see
# gloaming_agent/agent_loop.py) - this workflow simply fires every 15 minutes
# around the clock and the Agent itself decides whether to act.
#
# Cron minutes are offset to :07/:22/:37/:52 rather than the exact quarter-hour
# marks. Confirmed live Sept 12: a schedule of "*/15 * * * *" produced zero
# triggered runs across three consecutive marks (over 45 minutes) after being
# added - GitHub's own docs explain why: "the start of every hour" (and by
# extension every exact quarter-hour) is a documented high-load point for
# Actions' scheduler, and jobs scheduled exactly on it are the most likely to
# be delayed or dropped. Offsetting a few minutes off the mark is GitHub's own
# recommended workaround, not a guess.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gloaming-agent-loop
  cancel-in-progress: false

jobs:
  run-agent-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync to the true latest master
        run: |
          # GitHub resolves which commit actions/checkout fetches at the moment
          # this run is TRIGGERED/queued, not when the job actually starts. Two
          # triggers landing close together (proven live Sept 13: one queued
          # behind the other by this workflow's own concurrency group, exactly
          # as designed) means the second job can sit queued for minutes while
          # the first one runs and pushes - so by the time it starts, its
          # checkout is already stale relative to master, guaranteeing a
          # conflict on push. Force a fetch and hard reset to the real current
          # tip immediately before running anything, so the Agent always reads
          # and writes against the actual latest state, not a pinned-at-trigger
          # snapshot.
          git fetch origin master
          git reset --hard origin/master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: pip install -r engine/requirements.txt

      - name: Install Node dependencies (bgc CLI)
        run: npm ci

      - name: Run one Agent cycle
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: python gloaming_agent/agent_loop.py --run

      - name: Commit updated ledger and decision log
        run: |
          git config user.name "gloaming-agent[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add gloaming_agent/paper_ledger.json gloaming_agent/decision_log/*.jsonl
          if git diff --staged --quiet; then
            echo "No ledger/log changes this cycle (market open, or no fills) - nothing to commit."
            exit 0
          fi
          git commit -m "Agent cycle: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A manual push to master while this cycle was running would make a plain
          # push fail (non-fast-forward). Rebase onto the latest master first so a
          # code change landing in between never blocks the ledger/log from saving.
          git pull --rebase origin master
          git push
